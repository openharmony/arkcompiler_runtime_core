---
cases:
    - main: |-
          let s: string = ((): string => 'hello')()
          new A<string>().fld = trueVar ? s : undefined
      expected_out: |-
          Semantic error ESE0318: Type 'String|undefined' cannot be assigned to type 'String'

    - main: |-
          let s: string = ((): string => 'hello')()
          new A<string|undefined>().fld = trueVar ? s : null
      expected_out: |-
          Semantic error ESE0318: Type 'String|null' cannot be assigned to type 'String|undefined'

    - main: |-
          new A<string|null>().fld = !trueVar ? null : undefined
      expected_out: |-
          Semantic error ESE0318: Type 'null|undefined' cannot be assigned to type 'String|null'

    - main: |-
          let s: string = ((): string => 'hello')()
          let a: A<string> = { fld: trueVar ? s : undefined }
      expected_out: |-
          Semantic error ESE0319: Type 'String|undefined' is not compatible with type 'String' at property 'fld'

    - main: |-
          let s: string = ((): string => 'hello')()
          let a: A<string|undefined> = { fld: trueVar ? s : null }
      expected_out: |-
          Semantic error ESE0319: Type 'String|null' is not compatible with type 'String|undefined' at property 'fld'

    - main: |-
          let a: A<string|null> = { fld: !trueVar ? null : undefined }
      expected_out: |-
          Semantic error ESE0319: Type 'null|undefined' is not compatible with type 'String|null' at property 'fld'
