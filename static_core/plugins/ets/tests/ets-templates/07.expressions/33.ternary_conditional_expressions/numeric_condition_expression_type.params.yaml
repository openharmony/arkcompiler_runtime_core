---
cases:

    - type: int
      whenTrue: '10'
      whenFalse: '20'
      check: |-
          arktest.assertTrue(x instanceof Int)
          arktest.assertEQ(x, 10)
          x = 42
          arktest.assertTrue(x instanceof Int)
          arktest.assertEQ(x, 42)

    - type: byte|short
      whenTrue: '10 as byte'
      whenFalse: '20 as short'
      check: |-
          arktest.assertTrue(x instanceof Byte)
          arktest.assertEQ(x, 10)
          x = 2 as short
          arktest.assertTrue(x instanceof Short)
          arktest.assertEQ(x, 2)

    - type: float|long
      whenTrue: 1.0f
      whenFalse: 42 as long
      check: |-
          arktest.assertTrue(x instanceof Float)
          arktest.assertEQ(x, 1.0f)
          x = 2 as long
          arktest.assertTrue(x instanceof Long)
          arktest.assertEQ(x, 2)

    - type: double|byte
      not_op: '!'
      whenTrue: '42.0'
      whenFalse: 127 as byte
      check: |-
          arktest.assertTrue(x instanceof Byte)
          arktest.assertEQ(x, 127)
          x = 2.0
          arktest.assertTrue(x instanceof Double)
          arktest.assertEQ(x, 2.0)

    - type: float|number
      not_op: '!'
      whenTrue: '42.0f'
      whenFalse: '1.0'
      check: |-
          arktest.assertTrue(x instanceof Number)
          arktest.assertEQ(x, 1.0)
          x = 33.0f
          arktest.assertTrue(x instanceof Float)
          arktest.assertEQ(x, 33.0f)
