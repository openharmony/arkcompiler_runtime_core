---
cases:
    - decl: |-
          class A<T extends Any> {
              field: T

              constructor() {
                  this.field = this.foo()
              }

              private foo(): T {
                  let t: T = undefined as T
                  return t
              }
          }
      main: |-
          let a = new A<number>()
          arktest.expectThrow(
              () => { let n: number = a.field },
              (e) => e instanceof ClassCastError
          )
      expected_out: |-
          Warning W0304: Possible cast of 'null' or 'undefined' to non-nullish type can throw 'ClassCastError' exception at runtime

    - decl: |-
          class X<out T> { }

          function foo(p1: X<Object>): X<number> {
              return p1 as X<number>
          }
      main: |-
          let x = new X<number>()
          arktest.assertEQ(foo(x), x)
      expected_out: |-
          Warning W369037: Cast expression `as X<Double>` is type unsafe. 'ClassCastError' exception can be thrown at runtime
