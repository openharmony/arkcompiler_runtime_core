---
cases:
    - defs: |-
          namespace myConsole {
              export function log(p: Any): void {
                  console.log(`${p}`)
              }
          }
      main: |-
          myConsole.log(`${ (2 === string) ? '3' : '2' }`)
      expected_out: |-
          - "Semantic error ESE0144: Type name 'string' used in the wrong context"

    - defs: |-
          class MyConsole {
              log(p: Any): void {
                  console.log(`${p}`)
              }
          }
          let myConsole = new MyConsole()
      main: |-
          myConsole.log(`${ (number == string) ? '3' : '2' }`)
      expected_out: |-
          - "Semantic error ESE0144: Type name 'number' used in the wrong context"
          - "Semantic error ESE0144: Type name 'string' used in the wrong context"

    - main: |-
          console.log(`${ ((typeof 2) === string) ? '3' : '2' }`)
      expected_out: |-
          - "Semantic error ESE0144: Type name 'string' used in the wrong context"

    - main: |-
          console.log('Result: ' + `${ number == 1.0 ? 1 : 2 }`)
      expected_out: |-
          - "Semantic error ESE0144: Type name 'number' used in the wrong context"

    - main: |-
          console.log(`${ (2 == Object) ? 1 : 2 }`)
      expected_out: |-
          - "Syntax error ESY0318: Class cannot be used as object."
