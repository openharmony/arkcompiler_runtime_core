---
cases:
    - desc: 'The setter is final and the getter is not.'
      decl: |-
          class A {
              private _value: string = ''

              get str(): string {
                  return this._value
              }

              final set str(p: string) {
                  this._value = p
              }
          }

          class B extends A {
          }
      main: |-
          let b = new B
          b.str = 'abc'
          arktest.assertEQ(b.str, 'abc')

    - desc: 'The getter is final and the setter is not.'
      decl: |-
          class A {
              private _value: string = ''

              final get str(): string {
                  return this._value
              }

              set str(p: string) {
                  this._value = p
              }
          }

          class B extends A {
          }
      main: |-
          let b = new B
          b.str = 'abc'
          arktest.assertEQ(b.str, 'abc')

    - desc: 'The setter is abstract and the getter is not.'
      decl: |-
          abstract class A {
              protected _value: string = ''

              get str(): string {
                  return this._value
              }

              abstract set str(p: string)
          }

          class B extends A {
              get str(): string {
                  return this._value + '!'
              }

              set str(p: string) {
                  this._value = p;
              }
          }
      main: |-
          let a: A = ((): A => new B)()
          a.str = 'abc'
          arktest.assertEQ(a.str, 'abc!')

          let b = new B
          b.str = 'def'
          arktest.assertEQ(b.str, 'def!')

    - desc: 'The getter is abstract and the setter is not.'
      decl: |-
          abstract class A {
              protected _value: string = ''

              abstract get str(): string

              set str(p: string) {
                  this._value = p
              };
          }

          class B extends A {
              get str(): string {
                  return this._value
              }

              set str(p: string) {
                  this._value = p + '?'
              };
          }
      main: |-
          let a: A = ((): A => new B)()
          a.str = 'abc'
          arktest.assertEQ(a.str, 'abc?')

          let b = new B
          b.str = 'def'
          arktest.assertEQ(b.str, 'def?')

    - desc: 'The setter is abstract and the getter is final.'
      decl: |-
          abstract class A {
              protected _value: string = ''

              final get str(): string {
                  return this._value
              }

              abstract set str(p: string)
          }

          class B extends A {
              set str(p: string) {
                  this._value = p;
              }
          }
      main: |-
          let a: A = ((): A => new B)()
          a.str = 'abc'
          arktest.assertEQ(a.str, 'abc')

          let b = new B
          b.str = 'def'
          arktest.assertEQ(b.str, 'def')

    - desc: 'The getter is abstract and the setter is final.'
      decl: |-
          abstract class A {
              protected _value: string = ''

              abstract get str(): string

              final set str(p: string) {
                  this._value = p
              };
          }

          class B extends A {
              get str(): string {
                  return this._value
              }
          }
      main: |-
          let a: A = ((): A => new B)()
          a.str = 'abc'
          arktest.assertEQ(a.str, 'abc')

          let b = new B
          b.str = 'def'
          arktest.assertEQ(b.str, 'def')
