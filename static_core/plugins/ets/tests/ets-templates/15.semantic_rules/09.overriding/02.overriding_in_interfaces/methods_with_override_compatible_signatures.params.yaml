---
cases:
    - descr: 'Method from subinterface overrides method from superinterface'
      decl: |
          interface I1 {
              foo() { return 1 } }
          interface I2 extends I1 {
              foo() { return 2 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), 2)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(), 2)

    - descr: 'Method from subinterface overrides both methods from superinterfaces'
      decl: |
          interface I1 {
              foo() { return 1 }
          }
          interface I2 {
              foo() { return 2 }
          }
          interface I3 extends I1, I2 {
              foo() { return 3 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), 2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(), 3)
          let x = ((): I1 => i3)()
          arktest.assertEQ(x.foo(), 3)
          let y = ((): I2 => i3)()
          arktest.assertEQ(x.foo(), 3)

    - descr: 'The first extended interface is selected'
      decl: |-
          interface I1 {
              foo(): int { return 1 }
          }
          interface I2 {
              foo(): int { return 2 }
          }
          interface I3 extends I1, I2 {}
          class Impl implements I3 {}
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), 2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(), 1)
          let obj = new Impl()
          arktest.assertEQ(obj.foo(), 1)

    - descr: 'Method from subinterface overrides both methods from superinterfaces'
      decl: |
          class C1 {}
          class C2 extends C1 {}
          class C3 extends C2 {}

          let c1 = new C1()
          let c2 = new C2()
          let c3 = new C3()

          interface I1 {
              foo(p: C3): C1 { return c1 }
          }
          interface I2 {
              foo(p: C2): C2 { return c2 }
          }
          interface I3 extends I1, I2 {
              foo(p: C1): C3 { return c3 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(new C3), c1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(new C2), c2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(new C1), c3)
          let x = (():I1 => i3)()
          arktest.assertEQ(x.foo(new C3), c3)
          let y = (():I2 => i3)()
          arktest.assertEQ(y.foo(new C2), c3)

    - descr: 'Methods from subinterfaces refer to the same implementation'
      decl: |
          interface I1 { foo() { return 1 } }
          interface I2 { foo() { return 2 } }
          interface I3 extends I1 {}
          interface I4 extends I1 {}
          interface I5 extends I3, I4 {}
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), 2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(), 1)
          let i4: I4 = {}
          arktest.assertEQ(i4.foo(), 1)
          let i5: I5 = {}
          arktest.assertEQ(i5.foo(), 1)
          let x = ((): I3 => i5)()
          arktest.assertEQ(x.foo(), 1)

    - descr: 'Override compatible by parameter method in subinterface'
      decl: |
          class Base {}
          class Derived extends Base {}

          interface I1 {
            foo(p: Derived) { return 1 }
          }
          interface I2 extends I1 {
            foo(p: Base) { return 2 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(new Derived), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(new Base), 2)
          arktest.assertEQ(i2.foo(new Derived), 2)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(new Derived), 2)

    - descr: 'Override compatible by return type method in subinterface'
      decl: |
          class Base {}
          class Derived extends Base {}

          let base = new Base()
          let derived = new Derived()

          interface I1 {
            foo(): Base { return base }
          }
          interface I2 extends I1 {
            foo(): Derived { return derived }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), base)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), derived)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(), derived)

    - descr: 'Overload method in subinterface'
      decl: |
          class Base {}
          class Derived extends Base {}

          let base = new Base()
          let derived = new Derived()

          interface I1 {
            foo(p1: Derived, p2: long): Base { return base }
          }
          interface I2 extends I1 {
            foo(p1: Base, p2: int): Derived { return derived }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(derived, 42 as long), base)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(base, 42), derived)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(derived, 42 as long), base)

    - descr: 'Override compatible by generic type parameter method in subinterface'
      decl: |
          class C1 {}
          class C2 extends C1 {}

          let c1 = new C1()
          let c2 = new C2()

          interface I1<T extends C1> {
            foo(p: T): C1 { return c1 }
          }
          interface I2 extends I1<C2> {
            foo(p: C1): C2 { return c2 }
          }
      main: |-
          let i1: I1<C2> = {}
          arktest.assertEQ(i1.foo(c2), c1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(c1), c2)
          let x = ((): I1<C2> => i2)()
          arktest.assertEQ(x.foo(c2), c2)

    - descr: 'Override compatible by generic return type method in subinterface'
      decl: |
          class C1 {}
          class C2 extends C1 {}

          let c1 = new C1()
          let c2 = new C2()

          interface I1<out T extends C1> {
            foo(p: C2): T;
          }
          interface I2<out T extends C2> extends I1<T> {
            foo(p: C1): T;
          }
          class A1 implements I1<C1> {
            foo(p: C2): C1 { return c1 }
          }
          class A2 implements I2<C2> {
            foo(p: C1): C2 { return c2 }
          }
      main: |-
          let i1: I1<C1> = new A1()
          arktest.assertEQ(i1.foo(c2), c1)
          let i2: I2<C2> = new A2()
          arktest.assertEQ(i2.foo(c1), c2)
          let x = ((): I1<C1> => i2)()
          arktest.assertEQ(x.foo(c2), c2)

    - descr: 'Transitive overriding with generic return type method'
      decl: |
          class C1 {}
          class C2 extends C1 {}
          class C3 extends C2 {}

          let c1 = new C1()
          let c2 = new C2()
          let c3 = new C3()

          interface I1<out T extends C1> {
            foo(p: C3): T
          }
          interface I2<out T extends C2> extends I1<T> {
            foo(p: C2): T
          }
          interface I3<out T extends C3> extends I2<T> {
            foo(p: C1): T
          }
          class A1 implements I1<C1> {
            foo(p: C3): C1 { return c1 }
          }
          class A2 implements I2<C2> {
            foo(p: C2): C2 { return c2 }
          }
          class A3 implements I3<C3> {
            foo(p: C1): C3 { return c3 }
          }
      main: |-
          let i1: I1<C1> = new A1()
          arktest.assertEQ(i1.foo(c3), c1)
          let i2: I2<C2> = new A2()
          arktest.assertEQ(i2.foo(c2), c2)
          let i3: I3<C3> = new A3()
          arktest.assertEQ(i3.foo(c1), c3)
          let x = ((): I1<C1> => i2)()
          arktest.assertEQ(x.foo(c3), c2)
          let y = ((): I2<C2> => i3)()
          arktest.assertEQ(y.foo(c2), c3)

    - descr: 'Transitive overriding with generic type parameter method'
      decl: |
          class C1 {}
          class C2 extends C1 {}
          class C3 extends C2 {}

          let c1 = new C1()
          let c2 = new C2()
          let c3 = new C3()

          interface I1<in T extends C2> {
            foo(p: T): C1 { return c1 }
          }
          interface I2<in T extends C2> extends I1<T> {
            foo(p: T): C2 { return c2 }
          }
          interface I3 extends I2<C2> {
            foo(p: C1): C3 { return c3 }
          }
      main: |-
          let i1: I1<C3> = {}
          arktest.assertEQ(i1.foo(c3), c1)
          let i2: I2<C2> = {}
          arktest.assertEQ(i2.foo(c2), c2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(c1), c3)
          let x = ((): I1<C3> => i2)()
          arktest.assertEQ(x.foo(c3), c2)
          let y = ((): I2<C2> => i3)()
          arktest.assertEQ(y.foo(c2), c3)

    - descr: 'Transitive overriding with generic parameter and return type method'
      decl: |
          class C1 {}
          class C2 extends C1 {}
          class C3 extends C2 {}

          let c1 = new C1()
          let c2 = new C2()
          let c3 = new C3()

          interface I1<T extends C1> {
            foo(p: C3): T
          }
          interface I2<T extends C2> extends I1<C1> {
            foo(p: T): C2 { return c2 }
          }
          interface I3 extends I2<C2> {
            foo(p: C1): C3 { return c3 }
          }
          class A1 implements I1<C1> {
            foo(p: C3): C1 { return c1 }
          }
          class A2 implements I2<C2> {
          }
          class A3 implements I3 {
          }
      main: |-
          let i1: I1<C1> = new A1()
          arktest.assertEQ(i1.foo(c3), c1)
          let i2: I2<C2> = new A2()
          arktest.assertEQ(i2.foo(c2), c2)
          let i3: I3 = new A3()
          arktest.assertEQ(i3.foo(c1), c3)
          let x = ((): I1<C1> => i2)()
          arktest.assertEQ(x.foo(c3), c2)
          let y = ((): I2<C2> => i3)()
          arktest.assertEQ(y.foo(c2), c3)


    - descr: 'Method from one superinterface overrides method from another superinterface'
      decl: |
          class Base {}
          class Derived extends Base {}

          let base = new Base()
          let derived = new Derived()

          interface I1 {
            foo(p: Base) { return 1 }
          }
          interface I2 {
            foo(p: Derived) { return 2 }
          }
          interface I3 extends I1, I2 {}
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(base), 1)
          arktest.assertEQ(i1.foo(derived), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(derived), 2)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(base), 1)
          arktest.assertEQ(i3.foo(derived), 1)
          let x = ((): I1 => i3)()
          arktest.assertEQ(x.foo(base), 1)
          let y = ((): I2 => i3)()
          arktest.assertEQ(y.foo(derived), 2)

    - descr: 'Method from one superinterface overrides method from another superinterface'
      decl: |
          class Base {}
          class Derived extends Base {}

          let base = new Base()
          let derived = new Derived()

          interface I1 {
            foo(): Base { return base }
          }
          interface I2 {
            foo(): Derived { return derived }
          }
          interface I3 extends I1, I2 {}
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), base)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), derived)
          let i3: I3 = {}
          arktest.assertEQ(i3.foo(), base)
          let x = ((): I1 => i3)()
          arktest.assertEQ(x.foo(), base)
          let y = ((): I2 => i3)()
          arktest.assertEQ(y.foo(), derived)

      # Any vs Object effective type difference in interface overriding
    - descr: 'Override compatible by Any parameter in subinterface (Any is contravariant to Object)'
      decl: |
          interface I1 {
            foo(p: Object): int { return 1 }
          }
          interface I2 extends I1 {
            foo(p: Any): int { return 2 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(new Object), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(undefined), 2)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(new Object), 2)

    - descr: 'Override compatible by Object return type in subinterface (Object is covariant to Any)'
      decl: |
          interface I1 {
            foo(): Any { return 1 }
          }
          interface I2 extends I1 {
            foo(): Object { return 'abc' }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(), 'abc')
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(), 'abc')

    - descr: 'Override compatible by FixedArray<Any> parameter in subinterface'
      decl: |
          let fixedArrayObj: FixedArray<Object> = ['a', 'b', 'c']
          let fixedArrayAny: FixedArray<Any> = ['a', null, undefined]

          interface I1 {
            foo(p: FixedArray<Object>) { return 1 }
          }
          interface I2 extends I1 {
            foo(p: FixedArray<Any>) { return 2 }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo(fixedArrayObj), 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo(fixedArrayAny), 2)
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo(fixedArrayObj), 2)

    - descr: 'Override compatible by FixedArray<Object> return type in subinterface'
      decl: |
          interface I1 {
            foo(): FixedArray<Any> { return [1, null, undefined] }
          }
          interface I2 extends I1 {
            foo(): FixedArray<Object> { return ['a', 'b', 'c'] }
          }
      main: |-
          let i1: I1 = {}
          arktest.assertEQ(i1.foo()[0], 1)
          let i2: I2 = {}
          arktest.assertEQ(i2.foo()[0], 'a')
          let x = ((): I1 => i2)()
          arktest.assertEQ(x.foo()[0], 'a')
