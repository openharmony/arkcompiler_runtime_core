---
cases:
    - doc: |-
          CTE due to different return types.
      decl: |-
          class A {}
          class B extends A {}
          class Base<T,S> {
              foo(i: T, j: S) {
                  return;
              }
          }
          class Derived<T,S> extends Base<T,S> {
              foo(i: T, j: S): int {
                  return 1;
              }
          }
      expected_out:
          'Semantic error ESE0141: Class member foo with type Int in Derived<T,S> cannot override foo with type
          undefined field from class Base<T,S> because the overriding return type is not compatible with the other
          return type.'

    - doc: |-
          CTE as return type A contravariant to B.
      decl: |-
          class A {}
          class B extends A {}
          class Base<T, S> {
              foo(i: T, j: S): B {
                return new B();
              }
          }
          class Derived<T, S> extends Base<T, S> {
              foo(i: T, j: S): A {
                return new A();
              }
          }
      expected_out:
          'Semantic error ESE0141: Class member foo with type A in Derived<T,S> cannot override foo with type B field
          from class Base<T,S> because the overriding return type is not compatible with the other return type.'

    - doc: |-
          Return type in Derived is not covariant to return type in Base, CTE
      decl: |-
          class Base {
              foo(): Object { return new Object() }
          }
          class Derived extends Base {
              foo(): Any { return 1 }
          }
      expected_out: 'Semantic error ESE0136: Method foo(): Any in Derived not overriding any method'

    - doc: >-
          Parameter type in Derived is not contravariant to parameter type in Base, CTE
      decl: |-
          class Base {
              foo(p: Any) { }
          }
          class Derived extends Base {
              foo(p: Object) { }
          }
      expected_out: 'Semantic error ESE0136: Method foo(p: Object): void in Derived not overriding any method'

    - doc: >-
          Not override-compatible before the type erasure, but override-compatible after the type erasure, hence CTE
      decl: |-
          class Base {
              foo(p: Array<string>) { }  // runtime type std.core.Array
          }
          class Derived extends Base {
              foo(p: Array<number>) { }  // runtime type std.core.Array
          }
      expected_out: 'TODO: Not override-compatible before the type erasure, but override-compatible after the type erasure'

    - doc: >-
          Not override-compatible before the type erasure, but override-compatible after the type erasure, hence CTE
      decl: |-
          class Base {
              foo(p: [int, long]) { }  // runtime type std.core.Tuple2
          }
          class Derived extends Base {
              foo(p: [float, double]) { }  // runtime type std.core.Tuple2
          }
      expected_out: 'TODO: Not override-compatible before the type erasure, but override-compatible after the type erasure'

    - doc: >-
          Not override-compatible before the type erasure, but override-compatible after the type erasure, hence CTE
      decl: |-
          class Base {
              foo(p: string|undefined) { }  // runtime type std.core.String
          }
          class Derived extends Base {
              foo(p: Object) { }  // runtime type std.core.Object
          }
      expected_out: 'TODO: Not override-compatible before the type erasure, but override-compatible after the type erasure'

    - doc: >-
          Not override-compatible before the type erasure, but override-compatible after the type erasure, hence CTE
      decl: |-
          class Base  {
              foo(p: 'a'|'b'|'c') { }  // runtime type std.core.String
          }
          class Derived extends Base {
              foo(p: 'd'|'e'|'f') { }  // runtime type std.core.String
          }
      expected_out: 'TODO: Not override-compatible before the type erasure, but override-compatible after the type erasure'
