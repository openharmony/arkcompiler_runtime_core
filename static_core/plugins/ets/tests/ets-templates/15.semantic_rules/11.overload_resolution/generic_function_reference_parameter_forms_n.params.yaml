---
cases:
  - desc: >-
      Assigning a generic reference with a wider required parameter does not change the
      reference's narrower callable signature.
    expected_out: |-
      Semantic error ESE0127: No matching call signature for (Base, Int)
      Semantic error ESE0046: Type 'Base' is not compatible with type 'Derived' at index 1
    decl: |-
      function acceptsBase<T>(p: T, n: number): T { return p }
      function acceptsDerived<G extends T, T>(p: G, n: number): T { return p }
      let reference = acceptsDerived<Derived, Base>
      reference = acceptsBase<Base>
      reference(new Base(), 1)

  - desc: >-
      Assigning a generic reference with a wider optional parameter does not change the
      reference's narrower callable signature.
    expected_out: |-
      Semantic error ESE0127: No matching call signature for (Base, Int)
      Semantic error ESE0046: Type 'Base' is not compatible with type 'Derived' at index 1
    decl: |-
      function acceptsBase<T>(p: T, n?: number): T { return p }
      function acceptsDerived<G extends T, T>(p: G, n?: number): T { return p }
      let reference = acceptsDerived<Derived, Base>
      reference = acceptsBase<Base>
      reference(new Base(), 1)

  - desc: >-
      Assigning a generic reference with a wider rest parameter does not change the
      reference's narrower callable signature.
    expected_out: |-
      Semantic error ESE0127: No matching call signature for (Base, Int)
      Semantic error ESE0046: Type 'Base' is not compatible with type 'Derived' at index 1
    decl: |-
      function acceptsBase<T>(p: T, ...n: number[]): T { return p }
      function acceptsDerived<G extends T, T>(p: G, ...n: number[]): T { return p }
      let reference = acceptsDerived<Derived, Base>
      reference = acceptsBase<Base>
      reference(new Base(), 1)
