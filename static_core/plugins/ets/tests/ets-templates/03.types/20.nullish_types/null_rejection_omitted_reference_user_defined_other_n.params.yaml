cases:
  - desc: Null is rejected for a non-nullish user-defined class type.
    expected_out: 'Semantic error ESE0318: Type ''null'' cannot be assigned to type ''UserValue'''
    test_suffix: null_user_defined
    gap_id: GAP-03-0112
    grc_id: GRC-03-0144
    ci_id: CI-03-20-003-01
    decl: |-
      class UserValue {}
    use: |-
      let value: UserValue = null
  - desc: Undefined is rejected for a non-nullish primitive type.
    expected_out: 'Semantic error ESE0318: Type ''undefined'' cannot be assigned to type ''Int'''
    test_suffix: undefined_primitive
    gap_id: GAP-03-0112
    grc_id: GRC-03-0144
    ci_id: CI-03-20-003-01
    decl: |-
      let value: int = 0
    use: |-
      value = undefined
