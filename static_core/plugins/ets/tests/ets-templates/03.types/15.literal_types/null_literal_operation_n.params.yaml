cases:
  - suffix: null_literal
    literal_type: 'null'
    literal_value: 'null'
    gap: GAP-03-0085
    grc: GRC-03-0111
    ci: CI-03-15-002-01
    desc: The null literal type exposes no member operation.
    observation: Compilation rejects a member operation on a value whose static type is null.
  - suffix: undefined_literal
    literal_type: 'undefined'
    literal_value: 'undefined'
    gap: GAP-03-0086
    grc: GRC-03-0112
    ci: CI-03-15-002-02
    desc: The undefined literal type exposes no member operation.
    observation: Compilation rejects a member operation on a value whose static type is undefined.
