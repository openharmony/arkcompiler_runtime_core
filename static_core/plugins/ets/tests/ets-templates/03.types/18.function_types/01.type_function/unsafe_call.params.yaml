---
cases:
    - decl: |-
          function foo(...numbers: number[]) {
              return reduce(numbers, (prev: number, curr: number): number => prev + curr, 0.0)
          }
          const f: Function = foo
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4, 1.0, 3.3), 8.7)

    - decl: |-
          function foo(n: number) {
              return n + n
          }
          const f: Function = foo
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4), 8.8)

    - decl: |-
          const foo = (n: number) => { return n + n }
          const f: Function = foo
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4), 8.8)

    - decl: |-
          const f: Function = (n: number) => { return n + n }
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4), 8.8)

    - decl: |-
          function foo(n: number) { return n + n }
          const f: Function = foo
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4, 6.6), 8.8)

    - decl: |-
          function foo(n: number) { return n + n }
          const f: Function = foo
      main: |-
          arktest.assertEQ(f.unsafeCall(4.4, "just a test"), 8.8)

    - decl: |-
          type F = (n: number) => string
          const f: Function = (n: number): string => { return '' + n }
      main: |-
          const g = f as F
          arktest.assertEQ(g(4.4), '4.4')
