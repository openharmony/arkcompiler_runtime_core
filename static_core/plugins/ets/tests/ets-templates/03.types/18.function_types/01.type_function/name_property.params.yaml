---
cases:
    - decl: |-
          function func_name(f: Function): string { return f.name }
          function foo() {}
      main: |-
          arktest.assertEQ(func_name(foo), 'foo')

    - decl: |-
          function func_name(f: Function): string { return f.name }
          class A {
              static sm() {}
              m() {}
          }
      main: |-
          arktest.assertEQ(func_name(A.sm), 'sm')
          arktest.assertEQ(func_name(new A().m), 'm')

    - decl: |-
          function func_name(f: Function): string { return f.name }
          let x: Function = (): void => {}
      main: |-
          let y = x
          arktest.assertEQ(func_name(x), 'x')
          arktest.assertEQ(func_name(y), 'x')
          arktest.assertEQ(func_name((): void => {}), '')
