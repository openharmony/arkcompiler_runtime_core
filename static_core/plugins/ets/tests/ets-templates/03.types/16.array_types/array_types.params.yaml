---
cases:
    - type: Byte[]
      vals: '[new Byte(127), new Byte(2), new Byte(1)]'
      val: new Byte(42)
      assert: arr[0] == 42

    - type: FixedArray<byte>
      vals: '[3, 2, 1]'
      val: '0x7f'
      assert: arr[0] == Byte.MAX_VALUE

    - type: ValueArray<byte>
      vals: '[3, 2, 1]'
      val: -128
      assert: arr[0] == Byte.MIN_VALUE

    - type: FixedArray<short>
      vals: '[3, 2, 1]'
      val: '0x7fff'
      assert: arr[0] == Short.MAX_VALUE

    - type: ValueArray<short>
      vals: '[3, 2, 1]'
      val: -32768
      assert: arr[0] == Short.MIN_VALUE

    - type: int[]
      vals: '[3, 2, 1]'
      val: '0x7fffffff'
      assert: arr[0] == Int.MAX_VALUE

    - type: Array<long>
      vals: '[3, 2, 1]'
      val: '0x7fffffffffffffff'
      assert: arr[0] == Long.MAX_VALUE

    - type: FixedArray<float>
      vals: '[3, 2, 1]'
      val: 1.5f
      assert: arr[0] == 1.5f

    - type: ValueArray<number>
      vals: '[3, 2, 1]'
      val: 3.14e22
      assert: arr[0] == 3.14e22

    - type: double[]
      vals: '[3, 1, 2]'
      val: -1.5
      assert: arr[0] == -1.5

    - type: Array<char>
      vals: "[c'A', c'B', c'C']"
      val: c'Z'
      assert: arr[0] == c'Z'

    - type: ValueArray<char>
      vals: "[c'A', c'B', c'C']"
      val: c'\uCAFE'
      assert: arr[0] == c'\u{CAFE}'

    - type: boolean[]
      vals: '[true, false, true]'
      val: 'false'
      assert: arr[0] == false

    - type: ValueArray<boolean>
      vals: '[true, false, true]'
      val: 'false'
      assert: arr[0] == false

    - decl: enum Color { Red, Green, Blue }
      type: Color[]
      vals: '[Color.Red, Color.Green, Color.Blue]'
      val: Color.Green
      assert: arr[0] == Color.Green

    - type: Error[]
      vals: '[new Error("A"), new Error("B"), new Error("C")]'
      val: new Error("D")
      assert: arr[0].message == "D"

    - decl: type A = Object|undefined
      type: A[]
      vals: new A[2](undefined)
      val: new Boolean(true)
      assert: arr[0] instanceof Boolean && (arr[0] as Boolean)

    - decl: type A = (Object|null)[]
      type: A
      vals: '[null, null]'
      val: new Error("X")
      assert: arr[0] instanceof Error && (arr[0] as Error).message == "X"

    - decl: |-
          type A = int[]
          type B = A[]
      type: B
      vals: '[[1, 2], [3, 4]]'
      val: '[5, 6]'
      assert: arr[0][0] + arr[0][1] == 11
