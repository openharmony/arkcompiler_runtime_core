---
cases:
    # iterables

    - desc: 'Iterating over Array<Enum1>'
      main: |-
          for (let v: int|string of [Enum1.Zero, Enum1.Five, Enum1.Six])
              res += v instanceof int ? v : 100
          arktest.assertEQ(res, 11)

    - desc: 'Iterating over FixedArray<Enum1>'
      main: |-
          let fixed_array: FixedArray<Enum1> = [Enum1.Zero, Enum1.Five, Enum1.Six]
          for (let v: int|string of fixed_array)
              res += v instanceof int ? v : 100
          arktest.assertEQ(res, 11)

    - desc: 'Iterating over EnumIterable<Enum1>'
      main: |-
          for (let v: int|string of new EnumIterable<Enum1>([Enum1.Zero, Enum1.Five, Enum1.Six]))
              res += v instanceof int ? v : 100
          arktest.assertEQ(res, 11)

